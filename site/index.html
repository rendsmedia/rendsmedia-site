<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Rends Media</title>
  <style>
    :root { --ivory:#F7F5F0; --charcoal:#17191B; --slate:#263746; --grey:#777C7D; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
           background: var(--ivory); color: var(--charcoal);
           font: 16px/1.6 Georgia, "Times New Roman", serif; text-align: center; }
    h1 { font-weight: 400; font-size: clamp(28px, 5vw, 44px); letter-spacing: .02em; }
    p { margin-top: 12px; color: var(--grey); font-family: system-ui, sans-serif; font-size: 14px;
        letter-spacing: .12em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main>
    <h1>Rends Media</h1>
    <p>New site in progress</p>
  </main>
</body>
</html>
